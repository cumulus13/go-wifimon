name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required so GoReleaser can create the GitHub Release and upload assets
# to THIS repository (go-wifimon). The homebrew-tap and scoop-bucket pushes
# use GH_PAT instead (set below), because GITHUB_TOKEN can only write to
# the repo the workflow is running in.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Auto-provided by GitHub Actions — creates the Release and uploads
          # binaries to THIS repo. No secret to create.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Personal Access Token used ONLY to push to the separate
          # homebrew-tap and scoop-bucket repos.
          # Create at: github.com/settings/tokens → "repo" scope
          # Store at:  go-wifimon repo → Settings → Secrets → Actions → GH_PAT
          GH_PAT: ${{ secrets.GH_PAT }}
